<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="recGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#recGrad)" filter="url(#shadow)"/>
  <!-- Solar & Energy Grid Elements -->
  <g transform="translate(60, 60)">
    <!-- Sunburst rays -->
    <circle cx="0" cy="0" r="14" fill="#fef08a" />
    <circle cx="0" cy="0" r="9" fill="#f59e0b" />
    <!-- Orbiting Energy Ring -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85" />
    <!-- Solar Panel Grid Symbol -->
    <path d="M-18 16 L-8 32 L8 32 L18 16 Z" fill="#ffffff" opacity="0.95" />
    <line x1="-13" y1="24" x2="13" y2="24" stroke="#047857" stroke-width="1.5" />
    <line x1="0" y1="16" x2="0" y2="32" stroke="#047857" stroke-width="1.5" />
    <!-- Leaf / Renewable Badge -->
    <path d="M-22 -8 C-22 -22, -8 -26, 0 -22 C-4 -14, -10 -8, -22 -8 Z" fill="#a7f3d0" />
    <!-- Checkmark / Certificate Shield -->
    <path d="M12 -18 L17 -13 L26 -24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
